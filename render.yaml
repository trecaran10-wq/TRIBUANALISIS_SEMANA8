services:
  - type: web
    name: tribuanalisis
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /api/auth/status
    disk:
      name: tribuanalisis-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
    envVars:
      - key: TRIBUANALISIS_SECRET_KEY
        generateValue: true
      - key: TRIBUANALISIS_COOKIE_SECURE
        value: "1"
      - key: TRIBUANALISIS_REGISTRATION_CODE
        generateValue: true
